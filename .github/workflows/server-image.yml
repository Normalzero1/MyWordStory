name: server-image

# Builds the server Docker image and pushes it to GitHub Container Registry.
# The GCP VM pulls ghcr.io/<owner>/mywordstory-server:latest (see deploy/README.md).
on:
  push:
    paths: ["server/**", ".github/workflows/server-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mywordstory-server:latest" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ env.IMAGE }}
